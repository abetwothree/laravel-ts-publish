name: run-tests

on:
  push:
    paths:
      - "**.php"
      - "**.ts"
      - ".github/workflows/run-tests.yml"
      - ".github/scripts/**"
      - "phpunit.xml.dist"
      - "composer.json"
      - "composer.lock"
      - "package-lock.json"
      - "testbench.yaml"
      - "tsconfig*.json"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.5, 8.4]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: ${{ (matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && matrix.php == '8.5') && 'xdebug' || 'none' }}

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          if [ "${{ matrix.laravel }}" = "12.*" ]; then
            # Laravel 12 pins symfony/process ^7.2, which orchestra/testbench:10.* inherits and
            # never lifts (confirmed through v10.14.1). Pest 5 requires symfony/process ^8.1 and
            # phpunit ^13.2.6, so it can never resolve against Laravel 12. Pest 4 targets phpunit
            # ^12.5.33, which testbench 10.* does allow.
            composer require --dev "pestphp/pest:^4.0" "pestphp/pest-plugin-arch:^4.0" "pestphp/pest-plugin-laravel:^4.0" --no-interaction --no-update
          fi
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests with coverage
        if: always() && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && matrix.php == '8.5'
        run: vendor/bin/pest --ci --parallel --coverage --coverage-clover clover.xml

      - name: Execute tests without coverage
        if: always() && !(matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && matrix.php == '8.5')
        run: vendor/bin/pest --ci --parallel

      - name: Make code coverage badge
        if: always() && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && matrix.php == '8.5'
        uses: timkrase/phpunit-coverage-badge@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          coverage_badge_path: assets/coverage.svg
          push_badge: true

  type-inference-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: type inference gates

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          ini-values: memory_limit=1024M
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction
          npm ci

      - name: Regenerate the workbench type trees
        run: vendor/bin/pest --ci

      - name: Fail if the committed type trees are stale
        run: |
          if ! git diff --quiet -- workbench/resources/js/types/data; then
            echo "The generated TypeScript is out of date - run the test suite and commit the result."
            git diff --stat -- workbench/resources/js/types/data
            exit 1
          fi

      - name: Gate - the @tolki/ts type surface resolves
        run: |
          # Without this the gate fails OPEN: drop tests/types from tsconfig's include and tsc checks
          # nothing there, so the grep below is empty and the step passes with the guard disabled.
          if ! npx tsc --noEmit -p tsconfig.json --listFiles | grep -q 'tests/types/tolki-assertions\.ts'; then
            echo "FAIL - tests/types/tolki-assertions.ts is not in the tsc program, so the guard never ran"
            echo "Restore it to tsconfig.json's include - see docs/testing/type-inference-gates.md"
            exit 1
          fi
          errs=$(npx tsc --noEmit -p tsconfig.json 2>&1 | grep "^tests/types/" || true)
          if [ -n "$errs" ]; then
            echo "$errs"
            echo "@tolki/ts resolved to 'any' - the patch under patches/ is not applying."
            exit 1
          fi
          echo "PASS - @tolki/ts types resolve"

      - name: Gate - docs cite symbols, not line numbers
        run: .github/scripts/docs-anchor-gate.sh

      - name: Gate - no type token emitted without its import
        run: .github/scripts/unimportable-token-gate.sh 0 0 0

      - name: Gate - unknown-regression-gate parser self-test
        run: python3 .github/scripts/unknown-regression-gate.py --parsetest

      - name: Gate - token gate self-test
        run: .github/scripts/unimportable-token-gate.sh --selftest

      - name: Gate - no property regressed to unknown
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null || true)
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "Comparing $base..HEAD"
          python3 .github/scripts/unknown-regression-gate.py "$base" HEAD

  publish-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: publish speed (A/B vs merge-base)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install hyperfine
        run: sudo apt-get update && sudo apt-get install -y hyperfine

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Set up the merge-base worktree
        run: |
          # This workflow triggers on push (see `on:` above), not pull_request, so
          # github.base_ref is never populated - follow the same origin/main-with-
          # HEAD~1-fallback pattern the "no property regressed to unknown" gate above
          # already uses instead of relying on it.
          base=$(git merge-base origin/main HEAD 2>/dev/null || true)
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "Comparing $base..HEAD"
          git worktree add /tmp/base "$base"
          cp composer.lock /tmp/base/composer.lock
          composer install --prefer-dist --no-interaction --working-dir=/tmp/base
          echo "base: $(composer show laravel/framework --working-dir=/tmp/base | grep '^versions')"
          echo "head: $(composer show laravel/framework | grep '^versions')"

      - name: Gate - publish speed vs merge-base
        run: bash .github/scripts/publish-bench.sh /tmp/base "$PWD"
