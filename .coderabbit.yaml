# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # main, the default branch, is always reviewed; feature and fix PRs target develop.
    base_branches:
      - ^develop$
  path_instructions:
    - path: "src/**/*.php"
      instructions: >-
        Package source. Hold it to CLAUDE.md: `declare(strict_types=1)`, PHPStan level 10, a short docblock on
        every method, imported classes rather than inline FQCNs, and comments of at most 3 lines that say why.
        A require-dev class, or a Laravel class missing from a supported Laravel version, is referenced by string
        FQCN behind `class_exists()` (docs/laravel-version-guards.md). Before calling an untyped case a bug, read
        docs/known-gaps.md: several gaps are deliberate. A change that makes a published TypeScript type less
        specific, or turns a typed property into `unknown`, is a regression.
    - path: "src/Ast/**"
      instructions: >-
        The AST engine. It must not depend on any analyzer in src/Analyzers. `AstEngine` and `AnalysisResult` are
        its public entry points; everything else is internal. docs/components/ describes each subsystem, starting
        with docs/components/ast-engine.md.
    - path: "src/Analyzers/**"
      instructions: >-
        Analyzers are entry points only. All AST analysis belongs in the engine in src/Ast, so flag code here that
        walks or inspects AST nodes itself.
    - path: "workbench/resources/js/types/**"
      instructions: >-
        Generated by `composer test` from the PHP fixtures; never suggest editing these files by hand. Review them
        as the evidence for the change: flag a property that became `unknown`, a type token used without its
        import, or a type wider than its PHP source warrants, and point at the fixture or src/ code behind it.
    - path: "workbench/**"
      instructions: >-
        Test fixtures, not production code. A fixture may be deliberately odd to probe one inference case, so do
        not suggest reshaping it. The src/ style rules do not apply here.
    - path: "tests/**"
      instructions: >-
        Pest tests. docs/testing/test-fixtures.md explains where a test fixture goes; fixtures that feed the
        generated workbench output live in workbench/ instead.
    - path: ".github/scripts/**"
      instructions: >-
        CI gates over the committed generated TypeScript trees. docs/testing/type-inference-gates.md and
        docs/testing/performance-gate.md describe what each gate checks and why.
    - path: "docs/**/*.md"
      instructions: >-
        Internal docs for contributors and agents; user docs live in the separate Tolki docs repo. Keep them short,
        link to source files instead of restating code, and never anchor a link to a PHP line number (a CI gate
        fails on it).
    - path: "README.md"
      instructions: >-
        A brief overview. Each key capability fits on one line; detail belongs in the Tolki docs, linked from here.
    - path: "CHANGELOG.md"
      instructions: >-
        CI writes this file at release. Do not suggest edits to it.
    - path: "resources/boost/skills/**"
      instructions: >-
        The Laravel Boost skill shipped to users' agents. It changes through its own process, not in feature PRs:
        if a change makes it stale, say so in a comment rather than suggesting an edit.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CLAUDE.md
      - AGENTS.md
      - README.md
      - CONTRIBUTING.md
      - GLOSSARY.md
      - docs/**/*.md
